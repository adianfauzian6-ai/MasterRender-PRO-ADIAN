name: Build MasterRender PRO ADIAN EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python for BUILD ONLY
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Download FFmpeg for bundling
        shell: powershell
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_extract -Force
          $exe = Get-ChildItem -Path ffmpeg_extract -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "ffmpeg.exe tidak ditemukan setelah ekstraksi." }
          Copy-Item $exe.FullName .\ffmpeg.exe -Force

      - name: Build single EXE
        shell: powershell
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name "MasterRender_PRO_AfroxSTD_ADIAN" `
            --add-binary "ffmpeg.exe;." `
            masterrender_adian.py

      - name: Verify EXE
        shell: powershell
        run: |
          if (-not (Test-Path "dist\MasterRender_PRO_AfroxSTD_ADIAN.exe")) {
            throw "EXE tidak berhasil dibuat."
          }
          $size = (Get-Item "dist\MasterRender_PRO_AfroxSTD_ADIAN.exe").Length
          Write-Host "EXE size: $size bytes"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: MasterRender_PRO_AfroxSTD_ADIAN-Windows
          path: dist/MasterRender_PRO_AfroxSTD_ADIAN.exe

      - name: Create GitHub Release when tagged
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MasterRender_PRO_AfroxSTD_ADIAN.exe
